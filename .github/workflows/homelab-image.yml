name: homelab image

# Publishes ghcr.io/mitchross/umami:<tag> for a release tag like 3.5.0-homelab.1:
# the upstream version it is based on, then a fork release number that resets on each rebase.
# Tags have no `v` prefix, so upstream's own release workflow (tags v*.*.*) never runs here.
on:
  push:
    tags: ['*-homelab.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. 3.5.0-homelab.1
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$TAG" =~ ^${version//./\\.}-homelab\.[0-9]+$ ]]; then
            echo "Tag $TAG must be ${version}-homelab.<number> (package.json is ${version})." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/mitchross/umami:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/mitchross/umami
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
