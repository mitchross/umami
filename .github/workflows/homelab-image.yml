name: homelab image

# Builds the patched Umami (replay previews, page URLs, website config file) for the homelab.
# Tags: ghcr.io/mitchross/umami:<upstream version>-homelab.<short sha>, plus `homelab`.
on:
  push:
    branches: [homelab]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=${version}-homelab.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/mitchross/umami:${{ steps.meta.outputs.tag }}
            ghcr.io/mitchross/umami:homelab
          cache-from: type=gha
          cache-to: type=gha,mode=max
